<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AR Cấu trúc dữ liệu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#1b1230;color:#fff;overflow:hidden}
#ar{position:fixed;inset:0;overflow:hidden}
#flat{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:70px 8px 190px;background:linear-gradient(160deg,#fff0f8,#e8dcff,#e0fbf3)}
#flat canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:16px;box-shadow:0 8px 30px #0003}
button,input{font:inherit;border:0;border-radius:999px;padding:7px 13px;font-weight:700}
button{background:#ece4ff;color:#5b3a6b;cursor:pointer}
button.on{background:#ff8fc7;color:#fff}button.f{outline:3px solid #b8f2e0}button.alt{background:#ffe98a}
#top{position:fixed;top:8px;left:8px;right:8px;z-index:6;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
#tabs button{padding:6px 12px;font-size:14px}
#code{margin-top:6px;width:min(300px,62vw);max-height:38vh;overflow:auto;background:#1b1230d9;border-radius:14px;padding:8px;font:12px/1.5 Consolas,monospace}
#code .ln{white-space:pre;padding:0 6px;border-radius:5px;color:#cbb8ee}
#code .ln.on{background:#ff8fc7;color:#fff;font-weight:700}
#code .note{margin-top:6px;color:#ffe98a;font:600 12px system-ui}
#code button{padding:2px 9px;font-size:12px;margin-right:4px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#1b1230e6;padding:8px;max-height:42vh;overflow:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
#val{width:110px;background:#fff;color:#5b3a6b}
.q{font-weight:700;width:100%}
.opt{background:#fff;text-align:left}.opt.ok{background:#4fd1a5;color:#fff}.opt.bad{background:#ff6b8b;color:#fff}
small{color:#cbb8ee}
#start{position:fixed;inset:0;z-index:9;background:#1b1230;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#start p{max-width:520px;color:#cbb8ee;margin:0}
button:disabled{opacity:.5;cursor:wait}
body.locked .mindar-ui-scanning{display:none!important}
#lockbtn{position:fixed;right:12px;top:38%;width:62px;height:62px;border-radius:50%;font-size:28px;padding:0;z-index:7;box-shadow:0 4px 14px #0007;display:none}
body.scan #lockbtn{display:none!important}
body.scan #tabs,body.scan #code,body.scan #bar{display:none}
#err{position:fixed;left:8px;right:8px;top:8px;z-index:20;background:#ff4d6d;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;display:none;white-space:pre-wrap}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:#1b1230e6;padding:14px 22px;border-radius:18px;text-align:center;display:none;max-width:86vw}
#toast{width:max-content;max-width:86vw;text-align:center;position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#5b3a6b;padding:10px 20px;border-radius:999px;font-weight:700;z-index:10;display:none}
</style>
<script>
function showErr(m){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='⚠ '+m}console.error(m)}
addEventListener('error',function(e){showErr(e.message||'lỗi script')});
addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason||'lỗi không rõ')});
</script>
<script type="importmap">
{"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="ar"></div><div id="flat"></div>
<div id="start">
  <h1>🌳 AR Cấu trúc dữ liệu</h1>
  <p>Đưa camera vào ảnh cây nhị phân, cây AR sẽ hiện lên để bạn duyệt, thêm/xóa nút và làm trắc nghiệm.</p>
  <p id="stt">⏳ Đang khởi động...</p>
  <button id="bAR" class="on" disabled>📷 Bắt đầu AR</button>
  <button id="b2D">🖥️ Chế độ 2D (không cần camera)</button>
</div>
<div id="top"><div id="tabs"></div><div id="code"></div></div>
<button id="lockbtn" data-a="lock" title="Khóa / mở khóa cây"></button>
<div id="bar"><input id="val" type="number" placeholder="giá trị"><div id="ctl"></div></div>
<div id="toast"></div><div id="err"></div><div id="load"></div>

<script type="module">
let THREE,MindARThree,lockFn=null,isLocked=false;

const $=s=>document.querySelector(s), W=850, H=728, NAMES=['Cây nhị phân'], DEF=['pre'];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TN={pre:'tiền tự (NLR)',in:'trung tự (LNR)',post:'hậu tự (LRN)',level:'theo mức (BFS)'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)};

// ================= DỮ LIỆU =================
let nid=1; const mk=v=>({id:nid++,v,l:null,r:null});
let D; const S={lesson:0,mode:'duyet',sub:'bin',sel:null,steps:[],i:-1,code:'pre',lang:'gia',tm:0,q:null,sc:[0,0],showCode:true};
const found=[false,false,false]; let flat=false, CK=0, PL=false, NV={};
function initData(){
  nid=1; const a=[1,2,3,4,5,6].map(mk);               // cây mẫu giống ảnh đích
  a[0].l=a[1]; a[1].l=a[2]; a[1].r=a[3]; a[2].l=a[4]; a[2].r=a[5];
  D={bin:{root:a[0]},bst:{root:null}};
  [8,3,10,1,6,14,4].forEach(x=>bstIns(D.bst,x));
}
const T=()=>D[S.sub];
function lay(t=T()){   // cây thường: cha ở giữa các con (giống ảnh đích) · BST: trái→phải theo thứ tự giá trị
  const a=[];NV={};let sl=0;const bin=S.sub=='bin';
  const f=(n,d,p)=>{if(!n)return null;const e={n,d,p,x:0};a.push(e);NV[n.id]=n.v;
    if(bin){const xs=[n.l,n.r].map(c=>f(c,d+1,n)).filter(v=>v!==null);e.x=xs.length?xs.reduce((u,v)=>u+v)/xs.length:sl++}
    else{f(n.l,d+1,n);e.x=sl++;f(n.r,d+1,n)}
    return e.x};
  f(t.root,0,null);return a;
}
const find=id=>lay().find(e=>e.n.id===id)?.n;
const lab=(id,L=S.lesson)=>L?id:(NV[id]??id);

// ================= THUẬT TOÁN → DANH SÁCH BƯỚC {l: dòng code, cur, out, note} =================
function tSteps(kind){
  const r=T().root,s=[],out=[]; if(!r)return s;
  const P=(l,c,note)=>s.push({l,cur:c,out:[...out],note});
  if(kind=='level'){const q=[r];P(1,null,'hàng đợi = [gốc]');
    while(q.length){const n=q.shift();P(3,n.id,'lấy '+n.v+' ra khỏi hàng đợi');out.push(n.id);P(4,n.id,'thăm '+n.v);
      [n.l,n.r].forEach(c=>c&&q.push(c));P(5,n.id,'thêm con của '+n.v+' vào hàng đợi')}
    return s}
  const o={pre:'vlr',in:'lvr',post:'lrv'}[kind];
  (function f(n){P(0,n.id,'vào DUYỆT('+n.v+')');
    [...o].forEach((c,i)=>{ if(c=='v'){out.push(n.id);P(2+i,n.id,'thăm '+n.v)}
      else{P(2+i,n.id,'đi sang con '+(c=='l'?'trái':'phải'));n[c]?f(n[c]):P(1,n.id,'rỗng → quay lại')}})})(r);
  return s;
}
function bstIns(t,x){  // chèn vào BST, trả về các bước so sánh
  const nn=mk(x),s=[],out=[],P=(l,c,note)=>s.push({l,cur:c,out:[...out],note});
  if(!t.root){P(1,null,'cây rỗng');P(2,nn.id,'tạo gốc '+x);t.root=nn;return s}
  let c=t.root;
  for(;;){out.push(c.id);
    if(x===c.v){P(7,c.id,x+' = '+c.v+' → đã có, bỏ qua');return s}
    const L=x<c.v;P(L?3:5,c.id,`${x} ${L?'<':'>'} ${c.v} → sang ${L?'trái':'phải'}`);P(L?4:6,c.id,'gọi insert(con '+(L?'trái':'phải')+')');
    const nx=L?c.l:c.r; if(!nx){P(1,null,'gặp vị trí rỗng');P(2,nn.id,'chèn '+x);L?c.l=nn:c.r=nn;return s}
    c=nx}
}
const rmS=(n,id)=>!n?null:n.id===id?null:(n.l=rmS(n.l,id),n.r=rmS(n.r,id),n);   // cây thường: xóa nút + cây con
function rmB(n,id,tv){                                                            // BST: xóa chuẩn (successor)
  if(!n)return null;
  if(n.id===id){if(!n.l)return n.r;if(!n.r)return n.l;let s=n.r;while(s.l)s=s.l;n.v=s.v;n.r=rmB(n.r,s.id,s.v);return n}
  if(tv<n.v)n.l=rmB(n.l,id,tv);else n.r=rmB(n.r,id,tv);return n;
}

// ================= MÃ GIẢ + PYTHON (cùng số dòng) =================
const FN={pre:'pre_order',in:'in_order',post:'post_order'};
const CN={pre:'PreOrder',in:'InOrder',post:'PostOrder'};
const CS={
 level:['void Bfs(Node root) {','  var q = new Queue<Node>(); q.Enqueue(root);','  while (q.Count > 0) {','    var n = q.Dequeue();','    Console.Write(n.Val + " ");','    foreach (var c in new[] { n.Left, n.Right }) if (c != null) q.Enqueue(c);','  }','}'],
 insert:['Node Insert(Node n, int x) {','  if (n == null)','    return new Node(x);','  if (x < n.Val)','    n.Left = Insert(n.Left, x);','  else if (x > n.Val)','    n.Right = Insert(n.Right, x);','  return n;','}'],
};
const CPP={
 level:['void bfs(Node* root) {','  queue<Node*> q; q.push(root);','  while (!q.empty()) {','    Node* n = q.front(); q.pop();','    cout << n->val << " ";','    for (auto c : {n->left, n->right}) if (c) q.push(c);','  }','}'],
 insert:['Node* insert(Node* n, int x) {','  if (!n)','    return new Node(x);','  if (x < n->val)','    n->left = insert(n->left, x);','  else if (x > n->val)','    n->right = insert(n->right, x);','  return n;','}'],
};
function codeOf(k){
  if(FN[k]){const o={pre:'vlr',in:'lvr',post:'lrv'}[k],a={v:['THĂM n','print(n.val)','cout << n->val << " ";','Console.Write(n.Val + " ");'],l:['DUYỆT(n.trái)',FN[k]+'(n.left)',FN[k]+'(n->left);',CN[k]+'(n.Left);'],r:['DUYỆT(n.phải)',FN[k]+'(n.right)',FN[k]+'(n->right);',CN[k]+'(n.Right);']};
    return {gia:[k.toUpperCase()+'(n):','  nếu n rỗng: quay lại',...[...o].map(c=>'  '+a[c][0])],py:[`def ${FN[k]}(n):`,'  if n is None: return',...[...o].map(c=>'  '+a[c][1])],cpp:[`void ${FN[k]}(Node* n) {`,'  if (!n) return;',...[...o].map(c=>'  '+a[c][2]),'}'],cs:[`void ${CN[k]}(Node n) {`,'  if (n == null) return;',...[...o].map(c=>'  '+a[c][3]),'}']}}
  const C={
  level:{gia:['DUYỆT_MỨC(gốc):','  q ← [gốc]','  lặp khi q không rỗng:','    n ← lấy đầu q','    THĂM n','    thêm con n vào q'],
         py:['def bfs(root):','  q = [root]','  while q:','    n = q.pop(0)','    print(n.val)','    q += [c for c in (n.left, n.right) if c]']},
  insert:{gia:['CHÈN(n, x):','  nếu n rỗng:','    trả về nút mới x','  nếu x < n.giá_trị:','    n.trái ← CHÈN(n.trái, x)','  ngược lại nếu x > n.giá_trị:','    n.phải ← CHÈN(n.phải, x)','  trả về n'],
          py:['def insert(n, x):','  if n is None:','    return Node(x)','  if x < n.val:','    n.left = insert(n.left, x)','  elif x > n.val:','    n.right = insert(n.right, x)','  return n']},
}[k];
  return {...C,cpp:CPP[k],cs:CS[k]};
}
const cur=()=>PL||CK!==S.lesson?null:(S.steps[S.i]||null);
function codeHtml(){
  if(!S.showCode){$('#code').style.display='none';return}
  const c=codeOf(S.code),ls=c[S.lang],st=S.steps[S.i];
  $('#code').style.display='';
  $('#code').innerHTML=[['gia','Mã giả'],['py','Python'],['cpp','C++'],['cs','C#']].map(([v,t])=>`<button data-a="py" data-v="${v}" class="${S.lang==v?'on':''}">${t}</button>`).join('')+
    ls.map((t,i)=>`<div class="ln ${st&&st.l===i?'on':''}">${esc(t)}</div>`).join('')+(st?`<div class="note">▶ ${esc(st.note||'')}</div>`:'');
}

// ================= VẼ (dùng chung cho AR texture và 2D) =================
const CV=[0].map(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c}), TEX=[], PS=[[],[],[]];
const nst=id=>{const s=cur();return s?s.cur===id?'cur':(s.out||[]).includes(id)?'vis':'':''};
function node(g,x,y,r,t,st,sel){
  g.lineWidth=7;g.strokeStyle='#222';g.fillStyle=st=='cur'?'#ff8fc7':st=='vis'?'#b8f2e0':'#fff';
  g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke();
  if(sel){g.strokeStyle='#ffb800';g.lineWidth=6;g.beginPath();g.arc(x,y,r+10,0,7);g.stroke()}
  g.fillStyle='#222';g.font=`bold ${Math.round(r*.9)}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y+2);
}
const ln=(g,a,b)=>{g.strokeStyle='#222';g.lineWidth=5;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()};
const isSel=id=>!PL&&CK===S.lesson&&S.sel===id;
function dTree(g){
  const a=lay(),P=PS[0]=[];
  if(!a.length){g.fillStyle='#9a7fab';g.font='40px sans-serif';g.textAlign='center';g.fillText('Cây rỗng — vào ✏️ Sửa để thêm nút',W/2,H/2);return}
  const xs=a.map(e=>e.x),mn=Math.min(...xs),mx=Math.max(...xs),md=Math.max(...a.map(e=>e.d));
  const gx=Math.min(210,(W-140)/Math.max(mx-mn,1)),gy=Math.min(142,(H-300)/Math.max(md,1)),r=Math.min(34,gx*.42),m={};
  a.forEach(e=>{e.x=W/2+(e.x-(mn+mx)/2)*gx;e.y=160+e.d*gy;m[e.n.id]=e});
  a.forEach(e=>e.p&&ln(g,e,m[e.p.id]));
  if(S.sub=='bin'&&!PL)a.forEach(e=>{const p=e.p;if(p&&!(p.l&&p.r)){const q=m[p.id];g.fillStyle='#a98bff';g.font='bold 22px sans-serif';g.textAlign='left';g.fillText(p.l?'trái':'phải',(e.x+q.x)/2+10,(e.y+q.y)/2)}});
  a.forEach(e=>{node(g,e.x,e.y,r,e.n.v,nst(e.n.id),isSel(e.n.id));P.push({id:e.n.id,x:e.x,y:e.y,r})});
}
function draw(g,k){
  CK=k;g.clearRect(0,0,W,H);
  g.fillStyle=PL?'#fff':'rgba(255,255,255,.95)';g.beginPath();g.roundRect(6,6,W-12,H-12,34);g.fill();
  g.strokeStyle=PL?'#222':'#ffd6ec';g.lineWidth=PL?14:10;g.stroke();
  g.fillStyle='#ff6fb5';g.font='bold 38px sans-serif';g.textAlign='left';g.textBaseline='middle';
  g.fillText(`Bài ${k+1}: ${NAMES[k]}${k==0&&S.sub=='bst'?' · BST':''}`,36,50);
  dTree(g);
  const s=cur();
  if(s){g.fillStyle='#5b3a6b';g.font='600 28px sans-serif';g.textAlign='left';g.fillText(s.note||'',36,96);
    if(k<2){g.fillStyle='#a98bff';g.font='bold 32px sans-serif';g.fillText('Kết quả: '+(s.out||[]).map(i=>lab(i,k)).join(' → '),36,H-36)}}
}
const paint=k=>{draw(CV[k].getContext('2d'),k);if(TEX[k])TEX[k].needsUpdate=true};
function refresh(){paint(S.lesson);codeHtml()}
// ================= ĐIỀU KHIỂN =================
function stop(){clearInterval(S.tm);S.tm=0}
function play(steps,code){stop();S.steps=steps;S.i=0;S.code=code;
  if(steps.length>1)S.tm=setInterval(()=>{if(S.i<S.steps.length-1){S.i++}else stop();refresh()},1000);refresh()}
function clear(){stop();S.steps=[];S.i=-1}
function setLesson(i){S.lesson=i;S.sel=null;clear();S.code=DEF[i];S.q=S.mode=='quiz'?newQ():null;if(flat)$('#flat').replaceChildren(CV[i]);ui();refresh()}

function onNode(id){
  if(S.mode=='quiz'){if(S.q&&S.q.tap!=null&&!S.q.done&&id!=null)ans(id);return}
  if(id==null)return;                         // chạm trượt → giữ nguyên lựa chọn
  S.sel=S.sel===id?null:id;                    // chạm lại cùng nút = bỏ chọn
  if(S.sel!=null)toast('✅ Đã chọn nút '+(find(id)||{}).v);
  refresh();ui();
}
function tapAt(k,x,y){
  if(S.lesson!==k)setLesson(k);
  let h=null,bd=1e9;PS[k].forEach(p=>{const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;h=p}});
  if(h&&bd>Math.max(h.r*2.8,90))h=null;onNode(h?h.id:null);
}
CV.forEach((c,k)=>c.onpointerdown=e=>{const r=c.getBoundingClientRect();tapAt(k,(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)});

function edit(a){
  const t=T(),v=$('#val').value.trim(),L=S.lesson;
  if(L!=0)return;
  if(a=='del'){const n=find(S.sel);if(!n)return toast('Chạm chọn một nút trước');
    t.root=S.sub=='bst'?rmB(t.root,n.id,n.v):rmS(t.root,n.id);S.sel=null;clear();toast('Đã xóa nút '+n.v);return refresh()}
  if(a=='ins'){if(v==='')return toast('Nhập số cần chèn');play(bstIns(t,+v),'insert');return}
  if(v!==''&&!Number.isFinite(+v))return toast('Giá trị không hợp lệ');
  const x=v!==''?+v:Math.max(0,...lay().map(e=>e.n.v))+1;
  if(!t.root){t.root=mk(x);toast('✅ Đã tạo gốc '+x)}
  else{const p=find(S.sel);if(!p)return toast('👆 Hãy chạm vào một nút trên cây để chọn nút cha trước');const s=a=='addl'?'l':'r';if(p[s])return toast('Nút '+p.v+' đã có con '+(s=='l'?'trái':'phải')+' ('+p[s].v+')');p[s]=mk(x);toast('✅ Đã thêm '+x+' làm con '+(s=='l'?'trái':'phải')+' của nút '+p.v)}
  clear();refresh();
}

// ---- trắc nghiệm ----
function newQ(){
  const L=S.lesson,r=a=>a[Math.random()*a.length|0],sh=a=>[...a].sort(()=>Math.random()-.5);
  if(L==0&&lay().length<3)return {msg:'Cây cần ≥ 3 nút để làm trắc nghiệm — hãy thêm ở ✏️ Sửa.'};
  const ks=['pre','in','post','level'],ord=k=>{const s=tSteps(k);return s.length?s[s.length-1].out:[]},fmt=o=>o.map(i=>lab(i)).join(' ');
  const k=r(ks),o=ord(k);
  if(Math.random()<.35){const j=Math.random()*o.length|0;return {q:`👆 Chạm vào nút được thăm THỨ ${j+1} khi duyệt ${TN[k]}`,tap:o[j],kind:k}}
  const c=fmt(o),set=new Set(ks.map(x=>fmt(ord(x))));let n=0;while(set.size<4&&n++<40)set.add(fmt(sh(o)));
  const opts=sh([c,...[...set].filter(x=>x!==c).slice(0,3)]);
  return {q:`Kết quả duyệt ${TN[k]} là gì?`,opts,ans:opts.indexOf(c),kind:k};
}
function ans(i){const q=S.q;if(!q||q.done)return;q.done=1;q.pick=i;q.right=q.opts?i==q.ans:i===q.tap;S.sc[0]+=q.right?1:0;S.sc[1]++;
  if(q.kind)play(tSteps(q.kind),q.kind);ui();refresh()}

function ui(){
  const L=S.lesson,m=S.mode,B=(a,t,x='',c='')=>`<button class="${c}" data-a="${a}" ${x}>${t}</button>`;
  $('#tabs').innerHTML=B('code',S.showCode?'▼ Code':'▶ Code','',S.showCode?'':'alt')+B('rst','↺');
  const lb=$('#lockbtn');lb.style.display=lockFn?'block':'none';lb.textContent=isLocked?'🔓':'🔒';lb.className=isLocked?'on':'alt';
  let h='<div class="row">'+[['duyet','👀 Duyệt'],['sua','✏️ Sửa'],['quiz','🎓 Quiz']].map(([a,t])=>B('mode',t,`data-m="${a}"`,m==a?'on':'')).join('')+
    (L==0?B('sub',S.sub=='bin'?'🌳 Cây thường':'🔎 BST','','alt'):'')+'</div><div class="row">';
  if(m=='duyet'){
    if(L==0)h+=[['pre','Tiền tự'],['in','Trung tự'],['post','Hậu tự'],['level','Theo mức']].map(([k,t])=>B('alg',t,`data-k="${k}"`)).join('');
    h+=B('pv','◀')+B('pp','⏯')+B('nx','▶');
  }
  if(m=='sua'){
    if(L==0&&S.sub=='bin')h+=B('addl','＋ Trái')+B('addr','＋ Phải')+B('del','🗑️ Xóa nút');
    if(L==0&&S.sub=='bst')h+=B('ins','＋ Chèn')+B('del','🗑️ Xóa nút');
    if(L==0){const sn=find(S.sel);h+=`<small>${sn?'✅ Đang chọn nút <b>'+sn.v+'</b>':'👆 Chạm một nút trên cây để chọn'} · nhập số rồi bấm</small>`}
  }
  if(m=='quiz'){const q=S.q;h+=`<small>Điểm ${S.sc[0]}/${S.sc[1]}</small>`;
    if(q&&q.msg)h+=`<div class="q">${q.msg}</div>`;
    else if(q){h+=`<div class="q">${q.q}</div>`+(q.opts?q.opts.map((o,i)=>`<button class="opt ${q.done?(i==q.ans?'ok':i==q.pick?'bad':''):''}" data-a="opt" data-i="${i}">${esc(o)}</button>`).join(''):'')+
      (q.done?`<div class="q">${q.right?'✅ Chính xác!':'❌ Chưa đúng — xem animation giải thích.'}</div>`+B('nq','Câu tiếp ▶','','on'):'')}}
  $('#ctl').innerHTML=h+'</div>';
  $('#val').style.display=m=='sua'&&L!=1?'':'none';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a,L=S.lesson;
  if(a=='les')setLesson(+d.i);
  else if(a=='mode'){S.mode=d.m;S.sel=null;S.q=d.m=='quiz'?newQ():null;ui();refresh()}
  else if(a=='sub'){S.sub=S.sub=='bin'?'bst':'bin';S.sel=null;clear();S.code='pre';ui();refresh()}
  else if(a=='alg')play(tSteps(d.k),d.k);
  else if(a=='pv'||a=='nx'){stop();S.i=Math.max(0,Math.min(S.steps.length-1,S.i+(a=='nx'?1:-1)));refresh()}
  else if(a=='pp'){if(S.tm)stop();else if(S.steps.length){if(S.i>=S.steps.length-1)S.i=0;play(S.steps,S.code)}}
  else if(a=='opt')ans(+d.i);
  else if(a=='nq'){S.q=newQ();clear();ui();refresh()}
  else if(a=='py'){S.lang=d.v;codeHtml()}
  else if(a=='code'){S.showCode=!S.showCode;ui();codeHtml()}
  else if(a=='rst'){const m=S.mode;initData();setLesson(L);S.mode=m;toast('Đã đặt lại dữ liệu mẫu')}
  else if(a=='lock'&&lockFn)lockFn();
  else{edit(a);ui()}
});

// ================= KHỞI ĐỘNG =================
const stt=m=>$('#stt').textContent=m, load=m=>{const l=$('#load');l.style.display=m?'block':'none';l.innerHTML=m};
try{initData();paint(0);ui();codeHtml()}catch(e){showErr('Lỗi khởi tạo: '+e.message)}
function start2D(){flat=true;$('#start').style.display='none';load('');$('#flat').style.display='flex';$('#flat').replaceChildren(CV[S.lesson]);refresh()}
$('#b2D').onclick=start2D;

async function loadLibs(){                      // tải Three.js + MindAR, có CDN dự phòng
  try{
    THREE=await import('three');
    for(const u of ['https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js','https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.prod.js']){
      try{({MindARThree}=await import(u));break}catch(e){console.warn('Lỗi tải',u,e)}}
    if(!MindARThree)throw new Error('không tải được MindAR từ CDN');
    stt('✅ Thư viện AR đã sẵn sàng');$('#bAR').disabled=false;
  }catch(e){stt('❌ Không tải được thư viện AR ('+(e&&e.message||e)+'). Kiểm tra mạng rồi tải lại trang, hoặc dùng chế độ 2D.')}
}
loadLibs();

$('#bAR').onclick=async()=>{
  $('#err').style.display='none';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
      throw new Error('Trình duyệt đang chặn camera. Hãy mở bằng https:// hoặc http://localhost (Live Server / GitHub Pages), không mở file trực tiếp; dùng Chrome hoặc Safari, không dùng trình duyệt trong Zalo/Facebook.');
    const dv=await navigator.mediaDevices.enumerateDevices();
    if(!dv.some(d=>d.kind=='videoinput'))throw new Error('Thiết bị này không có camera — hãy dùng điện thoại hoặc chọn chế độ 2D.');
    let r;try{r=await fetch('./targets.mind')}catch(e){throw new Error('Không đọc được targets.mind. Hãy chạy qua Live Server / GitHub Pages (không mở file trực tiếp).')}
    if(!r.ok)throw new Error('Không tìm thấy targets.mind cạnh index.html (HTTP '+r.status+'). Kiểm tra tên file viết thường.');

    $('#start').style.display='none';document.body.classList.add('scan');
    load('📷 Đang bật camera...<br><small>Hãy bấm <b>Cho phép</b> khi trình duyệt hỏi quyền camera</small>');
    const mind=new MindARThree({container:$('#ar'),imageTargetSrc:'./targets.mind',maxTrack:1,uiLoading:'yes',uiScanning:'yes',uiError:'yes'});
    const {renderer,scene,camera}=mind,planes=[],anchors=[],locked=[false,false,false];let seen=false;
    scene.add(camera);                       // để vật gắn vào camera vẫn được vẽ
    [0].forEach(k=>{
      TEX[k]=new THREE.CanvasTexture(CV[k]);TEX[k].colorSpace=THREE.SRGBColorSpace;
      const p=new THREE.Mesh(new THREE.PlaneGeometry(1,H/W),new THREE.MeshBasicMaterial({map:TEX[k],transparent:true}));
      p.position.z=.005;planes.push(p);
      const an=mind.addAnchor(k);an.group.add(p);anchors[k]=an;
      an.onTargetFound=()=>{found[k]=true;load('');document.body.classList.remove('scan');if(!seen){seen=true;toast('🎯 Đã nhận ra cây nhị phân')}};
      an.onTargetLost=()=>{found[k]=false};
    });
    lockFn=()=>{                              // khóa: gắn tấm cây vào camera, giữ nguyên vị trí hiện tại trên màn hình
      if(locked.some(Boolean)){
        planes.forEach((p,k)=>{if(locked[k]){anchors[k].group.add(p);p.position.set(0,0,.005);p.rotation.set(0,0,0);p.scale.set(1,1,1);locked[k]=false}});
        isLocked=false;document.body.classList.remove('locked');toast('🔓 Đã mở khóa — cây bám theo ảnh trở lại');
      }else{
        scene.updateMatrixWorld(true);let c=0;
        planes.forEach((p,k)=>{if(found[k]){camera.attach(p);locked[k]=true;c++}});
        if(!c)return toast('Chưa quét thấy ảnh nào để khóa');
        isLocked=true;document.body.classList.add('locked');toast('🔒 Đã khóa — di chuyển máy thoải mái');
      }
      ui();
    };
    ui();
    const t=setTimeout(()=>showErr('Camera chưa bật sau 20 giây. Kiểm tra quyền camera của trình duyệt (biểu tượng ổ khóa cạnh thanh địa chỉ) rồi tải lại trang.'),20000);
    await mind.start();clearTimeout(t);load('');
    refresh();
    const ray=new THREE.Raycaster(),v=new THREE.Vector2();
    addEventListener('pointerdown',e=>{
      if(e.target.closest('#top,#bar,#lockbtn,#start,#err'))return;
      const rc=renderer.domElement.getBoundingClientRect();
      v.set((e.clientX-rc.left)/rc.width*2-1,-((e.clientY-rc.top)/rc.height)*2+1);ray.setFromCamera(v,camera);
      const hit=ray.intersectObjects(planes.filter(p=>p.parent.visible))[0];
      if(hit&&hit.uv)tapAt(planes.indexOf(hit.object),hit.uv.x*W,(1-hit.uv.y)*H);
    });
    renderer.setAnimationLoop(()=>renderer.render(scene,camera));
  }catch(err){
    load('');document.body.classList.remove('scan','locked');lockFn=null;isLocked=false;ui();$('#start').style.display='flex';
    showErr(((err&&err.message)||err||'Camera bị từ chối hoặc không khả dụng')+'');
  }
};
</script>
